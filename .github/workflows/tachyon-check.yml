name: Tachyon backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            binary: tachyon-core.exe
          - runner: ubuntu-latest
            os: linux
            binary: tachyon-core
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
      TACHYON_TEST_BINARY: ${{ github.workspace }}/deployment/test-core/${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: core/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: '31.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate RPC bindings
        shell: bash
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          protoc -I core/gen --go_out=core/gen --go-grpc_out=core/gen core/gen/libcore.proto
      - name: Verify pinned Tachyon package
        run: |
          python script/test_download_tachyon.py
          python script/download_tachyon.py --os ${{ matrix.os }} --arch amd64 --dest deployment/test-core
      - name: Test backend and original sing-box selection
        working-directory: core
        run: go test -ldflags '-checklinkname=0' -tags 'with_clash_api,with_quic,with_wireguard,with_utls,with_dhcp,with_tailscale,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0' ./internal/tachyon ./internal/process ./internal/rpc
